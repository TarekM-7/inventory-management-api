name: CI

on:
    push:
        branches:
            - main
    pull_request:

jobs:
    check:
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:18
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: inventory_ci_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
        env:
            DATABASE_URL: postgres://postgres:postgres@localhost:5432/inventory_ci_test
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - run: npm run format:check
            - run: npm run typecheck
            - run: npm run migrate
            - run: docker exec ${{ job.services.postgres.id }} pg_dump -U postgres --schema-only --no-owner --restrict-key=ci -t products -t movements inventory_ci_test > migrated.sql
            - run: npm test
            - run: docker exec ${{ job.services.postgres.id }} pg_dump -U postgres --schema-only --no-owner --restrict-key=ci -t products -t movements inventory_ci_test > synced.sql
            - run: diff migrated.sql synced.sql
            - run: npm run build
