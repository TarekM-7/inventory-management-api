components:
    schemas:
        Product:
            type: object
            properties:
                id:
                    type: integer
                    example: 1
                name:
                    type: string
                    maxLength: 100
                    example: Tornillo hexagonal M6 x 20 mm acero inoxidable
                code:
                    type: string
                    maxLength: 100
                    example: HEX-M6X20-INOX
                stock:
                    type: integer
                    minimum: 0
                    example: 500
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
        Error:
            type: object
            properties:
                msg:
                    type: string
                    example: Product not found
                path:
                    type: string
                    description: The field that caused the error, when there is one
                    example: code
        ErrorResponse:
            type: object
            properties:
                errors:
                    type: array
                    items:
                        $ref: "#/components/schemas/Error"
        ProductInput:
            type: object
            required:
                - name
                - code
            properties:
                name:
                    type: string
                    maxLength: 100
                    example: Tornillo hexagonal M6 x 20 mm acero inoxidable
                code:
                    type: string
                    maxLength: 100
                    description: Saved trimmed and in uppercase
                    example: hex-m6x20-inox
        PaginationMeta:
            type: object
            properties:
                page:
                    type: integer
                    example: 1
                limit:
                    type: integer
                    example: 20
                total:
                    type: integer
                    example: 100
                totalPages:
                    type: integer
                    example: 5
        Movement:
            type: object
            properties:
                id:
                    type: integer
                    example: 1
                productId:
                    type: integer
                    example: 1
                type:
                    type: string
                    enum:
                        - in
                        - out
                    example: in
                quantity:
                    type: integer
                    minimum: 1
                    example: 500
                note:
                    type: string
                    nullable: true
                    maxLength: 255
                    example: Inventario inicial
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
        MovementWithProduct:
            allOf:
                - $ref: "#/components/schemas/Movement"
                - type: object
                  properties:
                      product:
                          type: object
                          properties:
                              id:
                                  type: integer
                                  example: 1
                              name:
                                  type: string
                                  example: Tornillo hexagonal M6 x 20 mm acero inoxidable
                              code:
                                  type: string
                                  example: HEX-M6X20-INOX
        MovementInput:
            type: object
            required:
                - type
                - quantity
            properties:
                type:
                    type: string
                    enum:
                        - in
                        - out
                    example: in
                quantity:
                    type: integer
                    minimum: 1
                    maximum: 999999
                    example: 500
                note:
                    type: string
                    maxLength: 255
                    description: Saved trimmed
                    example: Inventario inicial
    parameters:
        Page:
            name: page
            in: query
            schema:
                type: integer
                minimum: 1
                maximum: 1000000
                default: 1
        Limit:
            name: limit
            in: query
            schema:
                type: integer
                minimum: 1
                maximum: 100
                default: 20
