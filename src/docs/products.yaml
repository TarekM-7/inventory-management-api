paths:
    /api/products:
        get:
            summary: List products, newest first
            tags:
                - Products
            parameters:
                - name: page
                  in: query
                  schema:
                      type: integer
                      minimum: 1
                      maximum: 1000000
                      default: 1
                - name: limit
                  in: query
                  schema:
                      type: integer
                      minimum: 1
                      maximum: 100
                      default: 20
            responses:
                200:
                    description: A page of products
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    data:
                                        type: array
                                        items:
                                            $ref: "#/components/schemas/Product"
                                    meta:
                                        type: object
                                        properties:
                                            page:
                                                type: integer
                                                example: 1
                                            limit:
                                                type: integer
                                                example: 20
                                            total:
                                                type: integer
                                                example: 100
                                            totalPages:
                                                type: integer
                                                example: 5
                400:
                    description: Invalid page or limit
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
        post:
            summary: Create a product
            tags:
                - Products
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/ProductInput"
            responses:
                201:
                    description: The created product
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    data:
                                        $ref: "#/components/schemas/Product"
                400:
                    description: Invalid data
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                409:
                    description: The code already exists
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
    /api/products/{id}:
        parameters:
            - name: id
              in: path
              required: true
              schema:
                  type: integer
                  minimum: 1
        get:
            summary: Get a product by id
            tags:
                - Products
            responses:
                200:
                    description: The product
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    data:
                                        $ref: "#/components/schemas/Product"
                400:
                    description: Invalid id
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                404:
                    description: Product not found
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
        put:
            summary: Update the name and code of a product
            description: The stock is not changed, even if it is sent.
            tags:
                - Products
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/ProductInput"
            responses:
                200:
                    description: The updated product
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    data:
                                        $ref: "#/components/schemas/Product"
                400:
                    description: Invalid id or data
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                404:
                    description: Product not found
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                409:
                    description: The code belongs to another product
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
        delete:
            summary: Delete a product
            tags:
                - Products
            responses:
                204:
                    description: Deleted, no body
                400:
                    description: Invalid id
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                404:
                    description: Product not found
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
